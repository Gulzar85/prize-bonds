[project]
name = "prizebonds-backend"
version = "0.1.0"
description = "Prize Bond Tracker API"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "django-filter==26.2",
    "django-cors-headers==4.9.0",
    "django-allauth[mfa,headless,headless-spec]==65.21.0",
    "argon2-cffi==25.1.0",
    "django-axes==8.3.1",
    "rules==3.5",
    "psycopg[binary,pool]==3.3.6",
    "django-redis==7.0.0",
    "celery[redis]==5.6.3",
    "django-celery-beat==2.9.0",
    "django-environ==0.14.0",
    "sentry-sdk==2.73.0",
    "structlog==26.1.0",
    "django-health-check==4.11.2",
    "django-auditlog==3.4.1",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
    "django-stubs-ext==6.1.2",
    "httpx==0.28.1",
    "certifi==2026.10.23",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "django-storages[s3]==1.14.6",
]

[dependency-groups]
dev = [
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "mypy==2.4.1",
    "django-stubs==6.1.2",
    "djangorestframework-stubs==3.18.1",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "pip-audit==2.10.1",
    "pyotp==2.10.0",
    "polib==1.2.0",
    "respx==0.23.1",
    "hypothesis==6.170.13",
]

[tool.uv]
default-groups = ["dev"]
# django-celery-beat 2.9.0 caps django<6.1; verified compatible by the test suite (see ADR notes).
override-dependencies = ["django==6.1.2"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "E402", "S105"]
"tests/*" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["apps.*", "api.*"]
strict = true

[[tool.mypy.overrides]]
module = ["allauth.*", "axes.*", "auditlog.*", "django_celery_beat.*", "rules.*", "health_check.*", "factory.*", "environ.*", "pyotp.*", "structlog.*"]
ignore_missing_imports = true

# django-rules and celery are untyped; the draws scaffold is replaced in Phase 1.
[[tool.mypy.overrides]]
module = ["apps.households.rules", "apps.draws.rules", "apps.core.tasks"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["apps", "api", "config"]
omit = ["*/migrations/*", "*/tests/*"]
