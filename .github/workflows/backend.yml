name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci-secret-key-not-used-in-production

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict for apps/ and api/)
        run: uv run mypy apps api
      - name: Tests with coverage (>= 90%)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run pytest --cov --cov-fail-under=90
      - name: Migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Deploy checks (prod settings, zero warnings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ${{ secrets.CI_DEPLOY_CHECK_KEY || 'x7Kq9mP2vL8nR4tY6wZ1bC3dF5gH0jA9sD2fG4hJ6kL8mN0pQ2rT4vX6zB8cE1' }}
          ALLOWED_HOSTS: example.com
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: OpenAPI schema matches the committed openapi.yaml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
